name: "doit_demo"
version: "1.0.0"
config-version: 2

profile: "doit_demo"

# The three warehouse layers live as top-level folders instead of being
# nested under a single `models/` directory. Each one is registered as its
# own dbt model path.
model-paths: ["raw", "staging", "marts"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Reporting currency for all monetary metrics
  reporting_currency: "USD"
  # How many days of already-loaded history an incremental run re-processes,
  # so late-arriving / restated billing lines are picked up again.
  incremental_lookback_days: 3
  # Run with --vars 'full_refresh_usage: true' to bypass the incremental
  # filter without dropping and rebuilding the tables.
  full_refresh_usage: false
  # The target BigQuery project has no billing account, so it runs in the
  # sandbox tier, which forbids all DML (MERGE / INSERT) and therefore every
  # dbt incremental strategy. While this is true the billing models build as
  # partitioned `table`s via create-or-replace instead. Flip to false once
  # billing is enabled to restore true incremental runs.
  # See macros/materialization.sql.
  bigquery_sandbox: true

# Because each layer is its own model path, the layer folder name is no longer
# part of a model's resource path - schema and materialisation are therefore
# set in each model's own `config()` block. Only project-wide defaults live
# here.
models:
  doit_demo:
    +persist_docs:
      relation: true
      columns: true
    +on_schema_change: "sync_all_columns"
